name: Scrape Dining Menus

on:
  schedule:
    # Every 2 hours, on the hour. GitHub cron is UTC-only (no timezone support),
    # so this can't be pinned to Eastern exactly. During EDT (UTC-4, summer) the
    # 4-hour offset is even, so these land on even Eastern hours — 12am, 2am, …,
    # 10pm, which is what we want. During EST (UTC-5, winter) they shift to odd
    # Eastern hours; still every 2 hours, just offset by one. The scraper itself
    # anchors "today" to America/Detroit, so the scraped data is correct in
    # either case regardless of when the run fires.
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and dependencies
        run: |
          mkdir -p /tmp/scraper
          cp scripts/scrape-menus.mjs scripts/scrape-netnutrition.mjs /tmp/scraper/
          cd /tmp/scraper && npm init -y && npm install playwright
          npx --prefix /tmp/scraper playwright install chromium --with-deps

      - name: Scrape all dining halls (today + next 2 days)
        env:
          SUPABASE_URL: https://gtkzwyhqxtubgmlvovmn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node /tmp/scraper/scrape-menus.mjs

      # Runs after every menu scrape (same schedule) since scrape-menus.mjs
      # deletes/recreates food_item + nutrition rows each time, which wipes
      # any previously-enriched ingredients/allergen flags. Without this
      # running on the same cadence, ingredients silently go stale/missing
      # for all current data within one scrape cycle.
      - name: Enrich ingredients + extra allergens from NetNutrition
        env:
          SUPABASE_URL: https://gtkzwyhqxtubgmlvovmn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node /tmp/scraper/scrape-netnutrition.mjs
